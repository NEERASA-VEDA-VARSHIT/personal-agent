[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent"
version = "0.1.0"
description = "Privacy-first personal agent with temporal memory and assessment-based decision support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.30.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.7.0",
  "sqlalchemy>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation"]
pythonpath = ["src", "apps/api"]
addopts = "-q"

[tool.ruff]
line-length = 100
